name: Destroy

# Tears down all Hetzner infrastructure via Terraform and removes
# the deploy secrets Bootstrap wrote. Run this before re-running
# Bootstrap to start completely fresh.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=capture/terraform.tfstate" \
            -backend-config="region=eu-central" \
            -backend-config="endpoint=${{ secrets.TF_STATE_ENDPOINT }}" \
            -backend-config="access_key=${{ secrets.TF_STATE_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.TF_STATE_SECRET_KEY }}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="force_path_style=true" \
            -backend-config="use_lockfile=true" \
            -backend-config="skip_requesting_account_id=true"

      - name: Terraform destroy
        working-directory: infra
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_tailscale_tailnet: ${{ secrets.TAILSCALE_TAILNET }}
          TF_VAR_ts_api_key: ${{ secrets.TS_API_KEY }}
          TF_VAR_server_name: placeholder
          TF_VAR_ssh_public_key: placeholder
        run: terraform destroy -auto-approve

      - name: Remove deploy secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret delete DEPLOY_HOST    || true
          gh secret delete DEPLOY_SSH_KEY || true
          gh secret delete DEPLOY_USER    || true
