services:
  satellite:
    image: ghcr.io/squaremo/capture-satellite:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - /opt/capture-satellite/.env
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Reuses the same GHCR image as the hub's own nginx (frontend/Dockerfile)
  # — only the mounted config differs. See satellite/nginx.conf and
  # designs/satellite-provisioning.md's "Docker + Watchtower deployment".
  nginx:
    image: ghcr.io/squaremo/capture-frontend:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./satellite/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/tailscale/certs:/etc/nginx/certs:ro
    depends_on:
      - satellite
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Local speech-to-text for the whisper-stream voice-input mode (see
  # designs/satellite-hardware.md and whisper/README.md) — a separate
  # image from `satellite` above so a box with no mic hardware, or one
  # that just hasn't opted in yet, never pulls whisper.cpp/ffmpeg/the
  # model file at all. `profiles: [whisper]` means Compose skips this
  # entirely by default; enable it with `docker compose --profile whisper
  # up -d`, or persistently by writing `COMPOSE_PROFILES=whisper` to a
  # `.env` file in this compose project's own working directory
  # (/opt/capture-satellite/app on a real satellite, where
  # infra/cloud-init-satellite.yaml.tpl's capture-satellite-sync.timer
  # re-runs `docker compose up` every 5 minutes) — Compose's CLI reads
  # its own .env from the project directory; that's a different file
  # from the `satellite` service's own /opt/capture-satellite/.env above
  # (an app-level env_file, a separate mechanism). Once running, point
  # the `satellite` service's own WHISPER_URL (see
  # satellite/.env.example) at it — both share the host network
  # namespace, so the default (http://127.0.0.1:5001) just works.
  whisper:
    image: ghcr.io/squaremo/capture-whisper:latest
    restart: unless-stopped
    network_mode: host
    profiles: ["whisper"]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Local speech synthesis (playback) — the mirror image of `whisper`
  # above (text in, audio out instead of audio in, text out). Same
  # opt-in reasoning: a satellite that hasn't set this up should never
  # pull Piper or a voice model. Enable it the same way:
  # `docker compose --profile tts up -d`, or `COMPOSE_PROFILES=tts` (or
  # `whisper,tts` if both are wanted) in this project's own .env (see
  # the `whisper` service's comment above for exactly which .env file).
  # Once running, point the `satellite` service's own TTS_URL (see
  # satellite/.env.example) at it — default http://127.0.0.1:5002.
  tts:
    image: ghcr.io/squaremo/capture-tts:latest
    restart: unless-stopped
    network_mode: host
    profiles: ["tts"]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # System telemetry agent (Beszel) — reports CPU/memory/disk/network,
  # the Pi's SoC temperature (cpu_thermal, read from /sys), and per-
  # container stats (via the read-only Docker socket) to the Beszel hub on
  # the central box (see docker-compose.yml's `beszel` service), which
  # stores and charts them. Opt-in via `profiles: [telemetry]`, same as
  # whisper/tts, because it can't start without per-box credentials the
  # hub issues: infra/enable-satellite-telemetry.sh writes them to
  # /opt/capture-satellite/beszel-agent.env (kept out of the `satellite`
  # container's own .env — neither container needs the other's secrets)
  # and turns the profile on. Outbound WebSocket to the hub only:
  # DISABLE_SSH stops the agent also opening its default SSH listener on
  # :45876, which under network_mode: host would be reachable from the
  # whole house LAN, not just the tailnet.
  beszel-agent:
    image: henrygd/beszel-agent:latest
    restart: unless-stopped
    network_mode: host
    profiles: ["telemetry"]
    env_file:
      - /opt/capture-satellite/beszel-agent.env
    environment:
      DISABLE_SSH: "true"
    volumes:
      - /opt/capture-satellite/beszel-agent:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --label-enable --cleanup
