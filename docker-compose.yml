services:
  backend:
    image: ghcr.io/squaremo/capture:latest
    restart: unless-stopped
    env_file:
      - infra/production.env
      - /opt/capture/.env.secret
    volumes:
      - /opt/capture/data:/data
    expose:
      - "3000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  nginx:
    image: ghcr.io/squaremo/capture-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Beszel hub UI + agent WebSocket (see the `beszel` service below)
      - "8090:8090"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/tailscale/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - beszel
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # System telemetry hub (Beszel) — charts CPU/memory/disk/network/
  # temperatures and per-container stats for every satellite Pi (and this
  # box too, if an agent is ever added here). Agents dial *in* to it over
  # a WebSocket (see docker-compose.satellite.yml's `beszel-agent`), so
  # this box never needs to reach a satellite. Not published directly —
  # nginx terminates TLS for it on :8090, same Tailscale cert as the app.
  # Its data lives outside /opt/capture/data on purpose: that directory is
  # the item store's git repo (backend/store.js), and a SQLite time-series
  # DB churning in there would be committed noise.
  beszel:
    image: henrygd/beszel:latest
    restart: unless-stopped
    volumes:
      - /opt/capture/beszel:/beszel_data
    expose:
      - "8090"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    # containrrr/watchtower was archived Dec 2025 and misdetects the Docker
    # API version against Docker Engine v29+, causing it to fail outright.
    # nickfedor/watchtower is the actively maintained fork — same image,
    # same config, drop-in replacement.
    image: nickfedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --label-enable --cleanup
