services:
  backend:
    image: ghcr.io/squaremo/capture:latest
    restart: unless-stopped
    env_file: /opt/capture/.env
    volumes:
      - /opt/capture/data:/data
    expose:
      - "3000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  nginx:
    image: ghcr.io/squaremo/capture-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/tailscale/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --label-enable --cleanup
