<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>satellite</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1rem;
    background: #0d0d0d; color: #e8e8e0;
    font-family: 'Berkeley Mono', ui-monospace, monospace;
  }
  h1 { font-family: 'Fraunces', serif; font-style: italic; color: #c8f060; margin: 0; }
  .row { display: flex; gap: 0.5rem; }
  input, button {
    font: inherit; padding: 0.6rem 0.8rem; border-radius: 4px;
    border: 1px solid #333; background: #1a1a1a; color: #e8e8e0;
  }
  button { cursor: pointer; border-color: #c8f060; color: #c8f060; }
  button:hover { background: #c8f060; color: #0d0d0d; }
  #status { color: #7eb8f7; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>satellite</h1>
  <div class="row">
    <input id="title" placeholder="title" size="18">
    <input id="artist" placeholder="artist (optional)" size="16">
    <input id="room" placeholder="room" size="12">
    <button id="play">play</button>
    <button id="pause">pause</button>
  </div>
  <div class="row">
    <input id="lightRoom" placeholder="room" size="12">
    <input id="brightness" placeholder="%" size="4" type="number" min="1" max="100">
    <button id="lightOn">on</button>
    <button id="lightOff">off</button>
    <button id="lightDim">dim</button>
  </div>
  <div id="status">…</div>
  <div id="lightStatus"></div>

<script>
async function refresh() {
  const res = await fetch('/api/status')
  const s = await res.json()
  document.getElementById('status').textContent = s.playing
    ? `[${s.house}] playing: ${s.track}${s.room ? ` in ${s.room}` : ''}`
    : `[${s.house}] paused`
}

document.getElementById('play').onclick = async () => {
  const title = document.getElementById('title').value.trim()
  const artist = document.getElementById('artist').value.trim()
  const room = document.getElementById('room').value.trim()
  if (!title) return
  await fetch('/api/play', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, artist, room }),
  })
  refresh()
}

document.getElementById('pause').onclick = async () => {
  await fetch('/api/pause', { method: 'POST' })
  refresh()
}

async function setLight(action) {
  const room = document.getElementById('lightRoom').value.trim()
  const brightness = Number(document.getElementById('brightness').value)
  if (!room) return
  const res = await fetch('/api/lights', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ room, action, brightness: action === 'set_brightness' ? brightness : undefined }),
  })
  const body = await res.json()
  document.getElementById('lightStatus').textContent = res.ok
    ? `${body.room}: ${body.action}${body.brightness ? ` ${body.brightness}%` : ''}`
    : `error: ${body.error}`
}

document.getElementById('lightOn').onclick = () => setLight('on')
document.getElementById('lightOff').onclick = () => setLight('off')
document.getElementById('lightDim').onclick = () => setLight('set_brightness')

refresh()
</script>
</body>
</html>
