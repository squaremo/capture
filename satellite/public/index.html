<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>satellite</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1rem;
    background: #0d0d0d; color: #e8e8e0;
    font-family: 'Berkeley Mono', ui-monospace, monospace;
  }
  h1 { font-family: 'Fraunces', serif; font-style: italic; color: #c8f060; margin: 0; }
  .row { display: flex; gap: 0.5rem; }
  input, button {
    font: inherit; padding: 0.6rem 0.8rem; border-radius: 4px;
    border: 1px solid #333; background: #1a1a1a; color: #e8e8e0;
  }
  button { cursor: pointer; border-color: #c8f060; color: #c8f060; }
  button:hover { background: #c8f060; color: #0d0d0d; }
  #status { color: #7eb8f7; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>satellite</h1>
  <div class="row">
    <input id="title" placeholder="title" size="18">
    <input id="artist" placeholder="artist (optional)" size="16">
    <input id="room" placeholder="room" size="12">
    <button id="play">play</button>
    <button id="pause">pause</button>
  </div>
  <div id="status">…</div>

<script>
async function refresh() {
  const res = await fetch('/api/status')
  const s = await res.json()
  document.getElementById('status').textContent = s.playing
    ? `[${s.house}] playing: ${s.track.title}${s.track.artist ? ` by ${s.track.artist}` : ''} on ${s.speaker.name}`
    : `[${s.house}] paused`
}

document.getElementById('play').onclick = async () => {
  const title = document.getElementById('title').value.trim()
  const artist = document.getElementById('artist').value.trim()
  const room = document.getElementById('room').value.trim()
  if (!title) return

  // Same two-step protocol the hub uses: search first (can fail, plays
  // nothing), then commit exactly that result.
  const searchRes = await fetch('/api/search', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, artist, room }),
  })
  if (!searchRes.ok) {
    const { error } = await searchRes.json()
    document.getElementById('status').textContent = `error: ${error}`
    return
  }
  const { track, speaker } = await searchRes.json()

  await fetch('/api/play', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ track, speaker }),
  })
  refresh()
}

document.getElementById('pause').onclick = async () => {
  await fetch('/api/pause', { method: 'POST' })
  refresh()
}

refresh()
</script>
</body>
</html>
