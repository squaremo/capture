# nginx for a satellite (see designs/satellite-provisioning.md's "Docker +
# Watchtower deployment"). Runs in the same GHCR capture-frontend image
# as the hub's nginx (frontend/Dockerfile) — this file is mounted over
# its default.conf at deploy time, same as the hub's own nginx.conf, so
# no separate frontend image build is needed for satellites.
#
# Proxies to the satellite API container over 127.0.0.1, not Docker DNS
# (like the hub's "backend:3000" does) — both containers run with
# network_mode: host, since the satellite container needs that for SSDP
# discovery and to see the host's Tailscale interface (see the design
# doc), and nginx needs it in turn just to reach the satellite over
# loopback with no shared bridge network in between.
upstream satellite_api {
    server 127.0.0.1:4000;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/app.crt;
    ssl_certificate_key /etc/nginx/certs/app.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /api/ {
        proxy_pass         http://satellite_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Generated per-request from the satellite's own env vars
    # (defaultHouse/backendUrl) — never a static file, so this can't be
    # served from the html root below like everything else under /.
    location = /config.json {
        proxy_pass http://satellite_api;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# The on-box kiosk (designs/satellite-hardware.md's Display stack) hits
# this over plain http://localhost rather than https://. Browsers treat
# "localhost" as a secure context regardless of TLS, so voice capture
# still works — and it sidesteps the self-signed cert (minted for this
# box's Tailscale MagicDNS name, not "localhost") throwing a
# cert-mismatch interstitial with no one there to click through it.
server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass         http://satellite_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /config.json {
        proxy_pass http://satellite_api;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# Any other Host header on :80 (i.e. a remote device, not the on-box
# kiosk) still gets bounced to HTTPS, same as the hub's nginx.conf.
server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}
