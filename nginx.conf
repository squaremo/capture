server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/app.crt;
    ssl_certificate_key /etc/nginx/certs/app.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Backend API
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend (static files served from /app/public in container)
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# Beszel telemetry hub (see docker-compose.yml's `beszel` service) — its
# own port rather than a path under :443, so its UI and API never have to
# share a URL space with the app's. Tailscale-only like everything else:
# the Hetzner firewall only admits Tailscale's UDP port, and the allow/deny
# below is defence in depth (real client IPs survive into Docker thanks to
# `--snat-subnet-routes=false`, see cloud-init.yaml.tpl). Satellite agents
# connect here too, as a long-lived WebSocket — hence the Upgrade headers
# and the long read timeout; buffering is off for the UI's live updates.
server {
    listen 8090 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/app.crt;
    ssl_certificate_key /etc/nginx/certs/app.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny  all;

    location / {
        proxy_pass         http://beszel:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_buffering    off;
        proxy_read_timeout 1h;
    }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    return 301 https://$host$request_uri;
}
